name: Deploy LLM Hub

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_DIR=$HOME/llm-hub

            # Clone on first deploy, pull on subsequent deploys
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Write .env file from GitHub Secrets
            cat > deploy/.env << ENVEOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            PUBLIC_DOMAIN=${{ secrets.PUBLIC_DOMAIN }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ENVEOF

            # XDG_RUNTIME_DIR may not be set over non-interactive SSH.
            # podman-compose references it when mounting the user's
            # rootless podman socket into the worker container.
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"

            # Ensure the rootless Podman API socket is enabled so the
            # worker container can spawn flow-runner containers through it.
            systemctl --user enable --now podman.socket || true

            # Build the flow-runner image used by the Celery worker.
            # Not part of podman-compose because it's spawned per flow,
            # not as a long-running service.
            podman build -t llmhub-flow-runner -f deploy/flow-runner/Containerfile .

            # Build and deploy the long-running services
            cd deploy
            podman-compose build \
              --build-arg PUBLIC_API_BASE_URL=https://${{ secrets.PUBLIC_DOMAIN }}/api
            podman-compose down
            podman-compose up -d

            # Wait for health checks to pass
            sleep 15
            podman-compose ps

            # Verify backend is healthy
            curl -sf http://localhost:8000/healthz || echo "WARNING: Backend health check failed"

            # Verify the worker is running (depends on redis + postgres)
            podman-compose ps worker | grep -q "Up" || echo "WARNING: Worker not running"
