name: Deploy LLM Hub

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_DIR=$HOME/llm-hub

            # Clone on first deploy, pull on subsequent deploys
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Write .env file from GitHub Secrets
            cat > deploy/.env << ENVEOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            PUBLIC_DOMAIN=${{ secrets.PUBLIC_DOMAIN }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}
            LLM_CONFIG_ENCRYPTION_KEY=${{ secrets.LLM_CONFIG_ENCRYPTION_KEY }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT }}
            FLOWRUNNER_DB_PASSWORD=${{ secrets.FLOWRUNNER_DB_PASSWORD }}
            ENVEOF

            # XDG_RUNTIME_DIR may not be set over non-interactive SSH.
            # podman-compose references it when mounting the user's
            # rootless podman socket into the worker container.
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"

            # Ensure the rootless Podman API socket is enabled so the
            # worker container can spawn flow-runner containers through it.
            systemctl --user enable --now podman.socket || true

            # --- LangFuse stack (self-hosted tracing backend) ---
            # Clones LangFuse's repo pinned to a tag, layers in our compose
            # override (log caps + CLICKHOUSE_LOG_LEVEL=warning), writes .env
            # from GitHub Secrets, and brings it up alongside llm-hub.
            LANGFUSE_DIR=$HOME/langfuse
            LANGFUSE_TAG=v3.134.0

            if [ ! -d "$LANGFUSE_DIR" ]; then
              git clone https://github.com/langfuse/langfuse.git "$LANGFUSE_DIR"
            fi
            cd "$LANGFUSE_DIR"
            git fetch --tags
            git checkout "$LANGFUSE_TAG"

            # Drop in our logging-cap override (upstream compose stays pristine)
            cp "$DEPLOY_DIR/deploy/langfuse/docker-compose.override.yml" .

            # Write LangFuse .env from GitHub Secrets.
            # INIT_* vars only take effect on a fresh Postgres DB — they auto-create
            # the org/project/user and bind the public/secret keys so llm-hub can
            # authenticate. All vars below are required; omitting any causes
            # LangFuse to skip init entirely (silent on traces, "Invalid credentials").
            cat > .env << LFENVEOF
            NEXTAUTH_SECRET=${{ secrets.LANGFUSE_NEXTAUTH_SECRET }}
            SALT=${{ secrets.LANGFUSE_SALT }}
            ENCRYPTION_KEY=${{ secrets.LANGFUSE_ENCRYPTION_KEY }}
            LANGFUSE_INIT_ORG_ID=llmhub
            LANGFUSE_INIT_ORG_NAME=LLM Hub
            LANGFUSE_INIT_PROJECT_ID=llmhub
            LANGFUSE_INIT_PROJECT_NAME=LLM Hub
            LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_INIT_PROJECT_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_INIT_USER_EMAIL=${{ secrets.LANGFUSE_ADMIN_EMAIL }}
            LANGFUSE_INIT_USER_NAME=Admin
            LANGFUSE_INIT_USER_PASSWORD=${{ secrets.LANGFUSE_ADMIN_PASSWORD }}
            LFENVEOF

            podman-compose up -d

            cd "$DEPLOY_DIR"
            # --- End LangFuse ---

            # Build the flow-runner image used by the Celery worker.
            # Not part of podman-compose because it's spawned per flow,
            # not as a long-running service.
            podman build -t llmhub-flow-runner -f deploy/flow-runner/Containerfile .

            # Build and deploy the long-running services.
            # PUBLIC_API_BASE_URL is a runtime env var (via $env/dynamic/public),
            # not a build arg — it's set in the frontend service's environment
            # block in podman-compose.yml, so no --build-arg needed here.
            cd deploy
            podman-compose build
            podman-compose down
            podman-compose up -d

            # Remove dangling images left over from this rebuild.
            # Only touches unreferenced layers — running containers are safe.
            podman system prune -f

            # Wait for health checks to pass
            sleep 15
            podman-compose ps

            # Verify backend is healthy
            curl -sf http://localhost:8000/healthz || echo "WARNING: Backend health check failed"

            # Verify the worker is running (depends on redis + postgres)
            podman-compose ps worker | grep -q "Up" || echo "WARNING: Worker not running"
